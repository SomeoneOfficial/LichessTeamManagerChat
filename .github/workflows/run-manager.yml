name: Run Lichess Team Manager

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command for main.py"
        required: false
        default: "status"
        type: choice
        options:
          - status
          - list-team-members
          - list-tournaments

  push:
    branches:
      - main
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/run-manager.yml"

permissions:
  contents: read

jobs:
  run-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
      MANAGER_COMMAND: ${{ inputs.command || 'status' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm secret exists
        run: |
          if [ -z "$LICHESS_TOKEN" ]; then
            echo "::error::LICHESS_TOKEN is missing from repository secrets."
            exit 1
          fi

      - name: Run team manager
        run: python main.py
