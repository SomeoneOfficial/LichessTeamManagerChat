name: Create 10 Lichess Swiss Tournaments

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "run.trigger"

permissions:
  contents: read

concurrency:
  group: lichess-swiss-creator
  cancel-in-progress: false

jobs:
  create-tournaments:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Lichess token
        shell: bash
        run: |
          if [ -z "$LICHESS_TOKEN" ]; then
            echo "::error::LICHESS_TOKEN is missing."
            exit 1
          fi

      - name: Create the tournaments
        run: python main.py
