name: Run Lichess Team Manager

on:
  push:
    branches:
      - main
    paths:
      - "command.json"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/run-manager.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lichess-team-manager
  cancel-in-progress: false

jobs:
  run-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$LICHESS_TOKEN" ]; then
            echo "::error::LICHESS_TOKEN is missing."
            exit 1
          fi

      - name: Validate command
        run: python -m json.tool command.json

      - name: Run manager
        run: python main.py
