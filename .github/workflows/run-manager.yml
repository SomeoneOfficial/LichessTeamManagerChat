name: Run Lichess Team Manager

on:
  push:
    branches:
      - main
    paths:
      - "command.json"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/run-manager.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lichess-team-manager
  cancel-in-progress: false

jobs:
  run-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$LICHESS_TOKEN" ]; then
            echo "::error::LICHESS_TOKEN is missing."
            exit 1
          fi

      - name: Validate command
        run: python -m json.tool command.json

      - name: Run manager
        run: python main.py

      - name: Validate generated teams JSON
        if: ${{ hashFiles('small_active_teams.json') != '' }}
        run: python -m json.tool small_active_teams.json > /dev/null

      - name: Commit generated JSON
        if: ${{ hashFiles('small_active_teams.json') != '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add small_active_teams.json

          if git diff --cached --quiet; then
            echo "Generated JSON is unchanged."
            exit 0
          fi

          git commit -m "Update discovered Lichess teams [skip ci]"
          git push origin HEAD:main
